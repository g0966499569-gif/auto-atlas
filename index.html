<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest"><title>Auto Atlas 全車系圖鑑</title><style>*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif}header{padding:28px 16px;background:linear-gradient(135deg,#b40000,#111)}h1{margin:0}.install,.b,.chip{border:0;border-radius:12px;padding:11px 14px;color:#fff;background:#29292e}.install{background:#ffd500;color:#111;font-weight:800}.wrap{max-width:1400px;margin:auto;padding:14px}.brands,.families{display:flex;gap:8px;overflow:auto;padding:10px 0}.chip{white-space:nowrap;border:1px solid #444}.chip.on{background:#d10000}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;position:sticky;top:0;background:#09090bf2;padding:8px 0;z-index:4}input,select{padding:12px;border-radius:10px;border:1px solid #444;background:#17171b;color:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:#17171b;border:1px solid #333;border-radius:15px;overflow:hidden}.photo{width:100%;height:190px;object-fit:cover;background:#25252a}.info{padding:14px}.meta{color:#aaa;font-size:13px}.tag{display:inline-block;background:#29292f;padding:4px 8px;border-radius:20px;margin:7px 3px 0 0;font-size:12px}.b{margin-top:10px;width:100%}dialog{width:min(760px,94vw);padding:0;border:1px solid #555;border-radius:16px;background:#17171b;color:#fff}.modal{padding:18px}.big{width:100%;max-height:430px;object-fit:contain;background:#080808}.x{float:right;border:0;border-radius:50%;width:36px;height:36px;font-size:20px}.notice{background:#2b230d;border-left:5px solid #ffd500;padding:12px;border-radius:8px}@media(max-width:650px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.cards{grid-template-columns:1fr}}</style></head><body><header><h1>Auto Atlas 全車系圖鑑</h1><p>先選品牌，再選車系家族；也可輸入 E46、W124、911、Cayenne 等名稱或代號。</p><button class="install" id="install" hidden>安裝到 Android</button></header><div class="wrap"><p class="notice">目前「全部車型」按品牌的量產道路車系與主要世代整理，不把每個地區的排氣量、變速箱、配備等級當成獨立車型。例如 BMW 320i/330i 會歸在對應3系列世代；Porsche 911則按世代與主要衍生型整理。</p><div class="brands" id="brands"></div><div class="families" id="families"></div><div class="filters"><input id="q" placeholder="搜尋名稱、代號、外觀：E46、W124、992"><select id="body"><option value="">所有車身</option></select><select id="tier"><option value="">所有定位</option></select></div><p id="count"></p><div id="cards" class="cards"></div></div><dialog id="dlg"><div class="modal"><button class="x" onclick="dlg.close()">×</button><h2 id="dn"></h2><img id="big" class="big"><div id="detail"></div></div></dialog><script>let data=[],brand='BMW',family='全部',deferred;const $=s=>document.querySelector(s);async function init(){data=await fetch('cars.json').then(r=>r.json());['body','tier'].forEach(k=>[...new Set(data.map(x=>x[k]))].forEach(v=>$('#'+k).add(new Option(v,v))));drawBrands();drawFamilies();render()}function drawBrands(){let a=[...new Set(data.map(x=>x.brand))];brands.innerHTML=a.map(b=>`<button class="chip ${b===brand?'on':''}" onclick="setBrand('${b.replaceAll("'","\'")}')">${b}</button>`).join('')}function setBrand(b){brand=b;family='全部';drawBrands();drawFamilies();render()}function drawFamilies(){let a=['全部',...new Set(data.filter(x=>x.brand===brand).map(x=>x.family))];families.innerHTML=a.map(f=>`<button class="chip ${f===family?'on':''}" onclick="setFamily('${f.replaceAll("'","\'")}')">${f}</button>`).join('')}function setFamily(f){family=f;drawFamilies();render()}function ok(x){let s=q.value.toLowerCase();return x.brand===brand&&(family==='全部'||x.family===family)&&(!s||Object.values(x).join(' ').toLowerCase().includes(s))&&(!body.value||x.body===body.value)&&(!tier.value||x.tier===tier.value)}async function photo(x,id){let e=document.getElementById(id);if(!e)return;try{let u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(x.query+' car')+'&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=900&format=json&origin=*';let j=await fetch(u).then(r=>r.json());let p=Object.values(j.query.pages)[0];e.src=p.imageinfo[0].thumburl||p.imageinfo[0].url}catch(z){e.alt='目前沒有載入到公開照片'}}function render(){let a=data.filter(ok);count.textContent=`${brand}：找到 ${a.length} 個車系/世代；資料庫共 ${data.length} 筆`;cards.innerHTML=a.map(x=>{let i=data.indexOf(x);return`<article class="card"><img class="photo" id="p${i}" loading="lazy" alt="${x.name}"><div class="info"><h3>${x.name}</h3><div class="meta">${x.family}</div><span class="tag">${x.body}</span><span class="tag">${x.tier}</span><button class="b" onclick="openCar(${i})">查看圖片與辨認資訊</button></div></article>`}).join('');setTimeout(()=>a.slice(0,45).forEach(x=>photo(x,'p'+data.indexOf(x))),0)}function openCar(i){let x=data[i];dn.textContent=x.name;detail.innerHTML=`<p><b>品牌：</b>${x.brand}<br><b>車系家族：</b>${x.family}<br><b>車身：</b>${x.body}<br><b>定位：</b>${x.tier}</p><p><b>大概價位：</b>${x.price}</p><p><b>外觀辨識：</b>${x.traits}</p><p><a style="color:#ffd500" target="_blank" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(x.query)}">查看更多角度圖片</a></p>`;big.removeAttribute('src');dlg.showModal();photo(x,'big')}['q','body','tier'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.hidden=false});install.onclick=async()=>{deferred&&deferred.prompt()};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');init()</script></body></html>
