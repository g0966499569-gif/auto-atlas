<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Auto Atlas 完整車款圖鑑</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0a84ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Auto Atlas"><style>
:root{--a:#0a84ff;--bg:#f2f2f7;--s:rgba(255,255,255,.84);--card:#fff;--t:#111;--m:#6e6e73;--line:rgba(60,60,67,.16)}@media(prefers-color-scheme:dark){:root{--bg:#000;--s:rgba(28,28,30,.86);--card:#1c1c1e;--t:#f5f5f7;--m:#98989d;--line:#3a3a3c}}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans TC",sans-serif}header{padding:48px 20px 56px;background:linear-gradient(145deg,#050508,#10264c);color:#fff}header div{max-width:1200px;margin:auto}h1{font-size:clamp(38px,8vw,64px);letter-spacing:-.055em;margin:6px 0 12px}header p{color:#b7c8df}.wrap{max-width:1200px;margin:auto;padding:0 14px 70px}.filters{position:sticky;top:8px;z-index:9;margin-top:-28px;padding:12px;background:var(--s);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 35px #0002}.row{display:flex;gap:7px;overflow:auto;padding:3px;scrollbar-width:none}.chip,.btn{border:1px solid var(--line);border-radius:13px;padding:10px 13px;background:#78788018;color:var(--t);white-space:nowrap;text-decoration:none;font-weight:600}.on,.primary{background:var(--a)!important;color:white!important;border-color:transparent!important}.search{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:8px}input,select{min-height:46px;background:#78788018;color:var(--t);border:1px solid var(--line);border-radius:14px;padding:0 13px;font:inherit}.count{color:var(--m);margin:18px 4px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card,.box{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:18px}.card h2{font-size:24px;margin:7px 0}.muted{color:var(--m);font-size:13px}.card button{margin-top:14px}dialog{width:min(940px,96vw);max-height:90vh;background:var(--card);color:var(--t);border:1px solid var(--line);border-radius:28px;padding:22px}dialog::backdrop{background:#0007;backdrop-filter:blur(10px)}.close{float:right;border:0;border-radius:50%;width:38px;height:38px;font-size:22px;background:#78788030;color:var(--t)}.tabs{display:flex;gap:8px;margin:14px 0}.gen{margin:10px 0}.gen summary{cursor:pointer;font-weight:700;font-size:18px;padding:15px;background:#78788018;border-radius:15px}.models{display:flex;flex-wrap:wrap;gap:7px;padding:12px 4px}.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.spec{padding:13px;background:#78788018;border-radius:15px}.spec b{display:block}.notice{padding:12px;background:#0a84ff18;border-left:4px solid var(--a);border-radius:10px}.hide{display:none}@media(max-width:650px){header{padding-top:38px}.search{grid-template-columns:1fr}.grid,.specs{grid-template-columns:1fr}dialog{width:100vw;max-width:none;margin:auto 0 0;border-radius:28px 28px 0 0}.filters{top:5px}}
</style></head><body><header><div><small>AUTO ATLAS</small><h1>完整車款圖鑑</h1><p>41 個品牌，依車系、世代及引擎型號瀏覽。</p></div></header><main class="wrap"><section class="filters"><div id="regions" class="row"></div><div id="brands" class="row"></div><div class="search"><input id="q" placeholder="搜尋品牌、車系、世代、CLA 45、C 300…"><select id="body"><option value="">所有車型</option><option>轎車/掀背車</option><option>SUV/跨界休旅</option><option>雙門跑車/GT</option><option>敞篷/跑車</option><option>MPV/廂型車</option><option>皮卡/商用車</option></select></div><button id="installBtn" class="btn primary" style="display:none;width:100%;margin-top:10px" onclick="installApp()">下載到手機主畫面</button></section><p id="count" class="count"></p><div id="grid" class="grid"></div></main><dialog id="dlg"><button class="close" onclick="dlg.close()">×</button><div id="detail"></div></dialog><script>
let D=[],reg='全部',brand='全部',view='generation';const $=x=>document.querySelector(x), esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){D=await fetch('cars.json').then(r=>r.json());drawFilters();render()}function uniq(a){return[...new Set(a)]}function drawFilters(){let rs=['全部',...uniq(D.map(x=>x.r))];regions.innerHTML=rs.map(x=>`<button class="chip ${x===reg?'on':''}" onclick="reg='${x}';brand='全部';drawFilters();render()">${x}</button>`).join('');let bs=['全部',...uniq(D.filter(x=>reg==='全部'||x.r===reg).map(x=>x.b)).sort()];brands.innerHTML=bs.map(x=>`<button class="chip ${x===brand?'on':''}" onclick="brand='${x}';drawFilters();render()">${x}</button>`).join('')}function text(x){return (x.b+' '+x.m+' '+JSON.stringify(x.g)).toLowerCase()}function filtered(){let z=q.value.trim().toLowerCase();return D.filter(x=>(reg==='全部'||x.r===reg)&&(brand==='全部'||x.b===brand)&&(!body.value||x.bt===body.value)&&(!z||text(x).includes(z)))}function render(){let a=filtered();count.textContent=`找到 ${a.length} 個車系`;grid.innerHTML=a.slice(0,500).map(x=>`<article class="card"><span class="muted">${esc(x.b)}｜${esc(x.bt)}</span><h2>${esc(x.m)}</h2><span class="muted">${x.g.length} 個世代｜${x.g.reduce((n,g)=>n+g.e.length,0)} 個動力版本</span><br><button class="btn primary" onclick="openSeries(${D.indexOf(x)})">查看世代與型號</button></article>`).join('')+(a.length>500?'<p class="notice">結果超過 500 筆，請使用品牌或搜尋縮小範圍。</p>':'')}function years(g){return `${g.a||'?'}–${g.b||'現在'}`}function engineName(e){return e.n||[e.cc?e.cc/1000+'L':'',e.c?e.c+'缸':'',e.hp?e.hp+' HP':''].filter(Boolean).join(' ')}function openSeries(i){let x=D[i];detail.innerHTML=`<h2>${esc(x.b)} ${esc(x.m)}</h2><p class="muted">${x.a||'?'}–${x.z||'現在'}｜${esc(x.bt)}</p><div class="tabs"><button class="btn ${view==='generation'?'primary':''}" onclick="view='generation';openSeries(${i})">依世代查看</button><button class="btn ${view==='all'?'primary':''}" onclick="view='all';openSeries(${i})">全部型號</button></div>${view==='generation'?x.g.map((g,gi)=>`<details class="gen" ${gi===x.g.length-1?'open':''}><summary>${esc(g.n)}｜${years(g)}</summary><div class="models">${g.e.map((e,ei)=>`<button class="btn" onclick="openEngine(${i},${gi},${ei})">${esc(engineName(e))}</button>`).join('')||'<span class="muted">本世代暫無引擎版本資料</span>'}</div></details>`).join(''):x.g.flatMap((g,gi)=>g.e.map((e,ei)=>`<button class="btn" style="margin:4px" onclick="openEngine(${i},${gi},${ei})">${esc(engineName(e))}｜${years(g)}</button>`)).join('')}`;dlg.showModal()}function val(v,u=''){return v!=null?esc(v)+u:'未提供'}function google(s){return'https://www.google.com/search?q='+encodeURIComponent(s)}function openEngine(i,gi,ei){let x=D[i],g=x.g[gi],e=g.e[ei],name=`${x.b} ${x.m} ${engineName(e)} ${g.n}`;detail.innerHTML=`<button class="btn" onclick="openSeries(${i})">‹ 返回 ${esc(x.m)}</button><h2>${esc(x.b)} ${esc(x.m)}</h2><p>${esc(engineName(e))}</p><p class="muted">${esc(g.n)}｜${years(g)}｜${esc(g.bt||x.bt)}</p><div class="specs"><div class="spec"><b>引擎</b>${val(e.cc,' cc')}｜${val(e.c,' 缸')}<br>${val(e.f)}</div><div class="spec"><b>輸出</b>${val(e.hp,' HP')}<br>${val(e.nm,' Nm')}</div><div class="spec"><b>性能</b>0–100：${val(e.z,' 秒')}<br>極速：${val(e.v,' km/h')}</div><div class="spec"><b>傳動</b>${val(e.dr)}<br>${val(e.tr)}</div><div class="spec"><b>車重</b>${val(e.kg,' kg')}</div></div><div class="models"><a class="btn primary" target="_blank" href="${google(name+' horsepower torque 0-100 top speed specifications')}">搜尋完整規格</a><a class="btn" target="_blank" href="${google(name+' 台灣 新車售價 中古車價格')}">搜尋售價</a><a class="btn" target="_blank" href="${google(name+' exterior interior images')}">搜尋圖片</a></div>`}let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installBtn.style.display='block'});async function installApp(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installBtn.style.display='none'}else{alert('iPhone：請按 Safari 下方「分享」→「加入主畫面」。Android：請按瀏覽器選單 →「安裝應用程式」或「加到主畫面」。')}}if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));q.oninput=render;body.onchange=render;init();</script></body></html>
