<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><title>Auto Atlas V2</title><style>:root{--r:#e50914;--bg:#08090b;--c:#16181d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif}header{padding:28px 18px;background:linear-gradient(135deg,#8a0008,#111)}h1{margin:0}.wrap{max-width:1450px;margin:auto;padding:12px}.sticky{position:sticky;top:0;z-index:4;background:#08090bf2;padding:8px 0}.chips{display:flex;gap:8px;overflow:auto;padding:6px 0}.chip,.btn{border:1px solid #444;background:#24262c;color:#fff;border-radius:99px;padding:10px 14px;white-space:nowrap}.on,.primary{background:var(--r)!important}.search{display:grid;grid-template-columns:2fr 1fr;gap:8px}input,select{padding:13px;border-radius:11px;border:1px solid #444;background:#14161a;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}.card{background:var(--c);border:1px solid #30333a;border-radius:15px;padding:15px}.card h3{margin:5px 0}.muted{color:#9ca3af;font-size:13px}.btn{border-radius:10px;text-decoration:none;display:inline-block}dialog{width:min(760px,94vw);background:#15171b;color:#fff;border:1px solid #555;border-radius:18px;padding:20px}.gen{background:#22252b;padding:12px;border-radius:12px;margin:9px 0}.models{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.x{float:right;border:0;border-radius:50%;width:36px;height:36px}@media(max-width:600px){.search{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style></head><body><header><h1>Auto Atlas V2</h1><p>車系 → 世代 → 型號，並可依車身類型篩選。</p></header><main class="wrap"><div class="sticky"><div id="regions" class="chips"></div><div id="brands" class="chips"></div><div class="search"><input id="q" placeholder="搜尋品牌、車系、底盤或型號"><select id="body"><option value="">所有車型</option><option>轎車/掀背車</option><option>SUV/跨界休旅</option><option>雙門跑車/GT</option><option>敞篷/跑車</option><option>MPV/廂型車</option><option>皮卡/商用車</option></select></div></div><p id="count" class="muted"></p><div id="grid" class="grid"></div></main><dialog id="dlg"><button class="x" onclick="dlg.close()">×</button><div id="detail"></div></dialog><script>let d=[],reg='全部',br='全部';const $=s=>document.querySelector(s);async function init(){d=await fetch('catalog.json').then(r=>r.json());drawR();drawB();render()}function drawR(){regions.innerHTML=['全部',...new Set(d.map(x=>x.region))].map(x=>`<button class="chip ${x===reg?'on':''}" onclick="reg='${x}';br='全部';drawR();drawB();render()">${x}</button>`).join('')}function drawB(){let a=['全部',...new Set(d.filter(x=>reg==='全部'||x.region===reg).map(x=>x.brand))];brands.innerHTML=a.map(x=>`<button class="chip ${x===br?'on':''}" onclick="br='${x}';drawB();render()">${x}</button>`).join('')}function ok(x){let s=q.value.toLowerCase();return(reg==='全部'||x.region===reg)&&(br==='全部'||x.brand===br)&&(!body.value||x.body===body.value)&&(!s||(x.brand+' '+x.model+' '+JSON.stringify(x.variants)).toLowerCase().includes(s))}function render(){let a=d.filter(ok);count.textContent=`找到 ${a.length} 個車系`;grid.innerHTML=a.map(x=>`<article class="card"><div class="muted">${x.brand}｜${x.body}</div><h3>${x.model}</h3><button class="btn primary" onclick="openM(${d.indexOf(x)})">查看世代與型號</button></article>`).join('')}function openM(i){let x=d[i],v=x.variants.length?x.variants.map(g=>`<section class="gen"><b>${g.gen}</b> <span class="muted">${g.years}</span><div class="models">${g.models.map(m=>`<a class="btn" target="_blank" href="https://www.google.com/search?q=${encodeURIComponent(x.brand+' '+m+' '+g.gen)}">${m}</a>`).join('')}</div></section>`).join(''):`<p class="muted">此車系尚未離線拆分，按下方按鈕直接搜尋其歷代型號。</p>`;detail.innerHTML=`<h2>${x.brand} ${x.model}</h2>${v}<a class="btn primary" target="_blank" href="https://www.google.com/search?q=${encodeURIComponent(x.brand+' '+x.model+' generations models facelift')}">搜尋全部歷代型號</a>`;dlg.showModal()}q.oninput=render;body.onchange=render;if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');init()</script></body></html>
