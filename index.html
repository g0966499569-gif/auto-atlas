<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<title>Auto Atlas · 車款圖鑑</title>
<style>
:root{--accent:#0a84ff;--accent2:#5e5ce6;--bg:#f2f2f7;--surface:rgba(255,255,255,.78);--solid:#fff;--text:#111114;--muted:#6e6e73;--line:rgba(60,60,67,.14);--shadow:0 12px 35px rgba(0,0,0,.09);--radius:22px}
@media(prefers-color-scheme:dark){:root{--bg:#000;--surface:rgba(28,28,30,.78);--solid:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:rgba(84,84,88,.52);--shadow:0 18px 45px rgba(0,0,0,.45)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Noto Sans TC",system-ui,sans-serif;letter-spacing:-.012em;min-height:100vh}button,input,select{font:inherit}button{touch-action:manipulation}
.hero{position:relative;overflow:hidden;padding:64px 20px 46px;background:linear-gradient(145deg,#050507 0%,#101525 58%,#091b36 100%);color:#fff}.hero:before{content:"";position:absolute;width:440px;height:440px;border-radius:50%;right:-150px;top:-260px;background:radial-gradient(circle,rgba(10,132,255,.7),transparent 68%);filter:blur(4px)}.hero:after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;left:-180px;bottom:-260px;background:radial-gradient(circle,rgba(94,92,230,.7),transparent 70%)}.hero-inner{position:relative;max-width:1180px;margin:auto}.eyebrow{font-size:13px;font-weight:700;color:#78b9ff;letter-spacing:.08em;text-transform:uppercase}.hero h1{font-size:clamp(38px,8vw,68px);line-height:.98;letter-spacing:-.055em;margin:10px 0 16px}.hero p{max-width:650px;margin:0;color:rgba(255,255,255,.72);font-size:17px;line-height:1.55}.flow{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}.flow span{padding:8px 12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;color:rgba(255,255,255,.88);font-size:13px}
.wrap{max-width:1180px;margin:auto;padding:0 18px 60px}.sticky{position:sticky;top:10px;z-index:20;margin:-22px 0 24px;padding:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:26px;backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px)}.chips{display:flex;gap:8px;overflow-x:auto;padding:3px 1px 7px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip,.btn{border:1px solid var(--line);background:rgba(118,118,128,.1);color:var(--text);border-radius:13px;padding:10px 14px;white-space:nowrap;cursor:pointer;transition:transform .18s ease,background .18s ease,box-shadow .18s ease}.chip:active,.btn:active{transform:scale(.96)}.chip.on,.primary{border-color:transparent!important;background:var(--accent)!important;color:white!important;box-shadow:0 7px 18px rgba(10,132,255,.25)}.search{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:4px}input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:15px;background:rgba(118,118,128,.1);color:var(--text);padding:0 15px;outline:none;transition:border .2s,box-shadow .2s,background .2s}input:focus,select:focus{border-color:var(--accent);background:var(--solid);box-shadow:0 0 0 4px rgba(10,132,255,.14)}
#count{margin:0 2px 14px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.card{position:relative;overflow:hidden;min-height:175px;background:var(--solid);border:1px solid var(--line);border-radius:var(--radius);padding:21px;box-shadow:0 3px 14px rgba(0,0,0,.04);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease}.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:opacity .25s}.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.card:hover:before{opacity:1}.card h3{font-size:25px;letter-spacing:-.035em;margin:8px 0 7px}.card .btn{position:absolute;left:20px;bottom:18px}.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-weight:600}.btn:after{content:" ›";margin-left:5px;font-size:18px;line-height:10px}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}dialog{width:min(900px,94vw);max-height:88vh;overflow:auto;background:var(--solid);color:var(--text);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:0 30px 90px rgba(0,0,0,.36);animation:sheetIn .32s cubic-bezier(.2,.8,.2,1)}dialog::backdrop{background:rgba(0,0,0,.42);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}dialog h2{font-size:31px;letter-spacing:-.04em;margin:3px 48px 8px 0}.x{position:sticky;float:right;top:0;z-index:2;border:0;border-radius:50%;width:38px;height:38px;background:rgba(118,118,128,.16);color:var(--text);font-size:23px;cursor:pointer}.gen{background:rgba(118,118,128,.09);border:1px solid var(--line);padding:16px;border-radius:18px;margin:11px 0}.models,.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}.back{margin-bottom:13px}.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.spec{background:rgba(118,118,128,.09);border:1px solid var(--line);border-radius:18px;padding:16px}.spec b{display:block;font-size:16px;margin-bottom:5px}.intro{line-height:1.72;color:var(--text)}.tip{border-left:4px solid var(--accent);background:rgba(10,132,255,.1);padding:13px 15px;border-radius:12px;margin:14px 0}.result-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
@media(max-width:700px){.hero{padding:46px 19px 52px}.hero h1{font-size:45px}.wrap{padding:0 12px 90px}.sticky{top:7px;margin-top:-23px;border-radius:22px;padding:11px}.search{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.card{min-height:158px}.specs{grid-template-columns:1fr}dialog{width:100vw;max-width:none;max-height:92vh;margin:auto 0 0;border-radius:28px 28px 0 0;border-bottom:0;padding:20px 16px 30px}.flow{gap:6px}.flow span{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body><header class="hero"><div class="hero-inner"><div class="eyebrow">AUTO ATLAS</div><h1>探索每一款車。</h1><p>從品牌、車系到世代與詳細型號，快速查找馬力、極速、售價與完整規格。</p><div class="flow"><span>品牌</span><span>車系</span><span>世代</span><span>型號</span><span>完整規格</span></div></div></header><main class="wrap"><div class="sticky"><div id="regions" class="chips"></div><div id="brands" class="chips"></div><div class="search"><input id="q" placeholder="搜尋品牌、車系、世代、底盤或詳細型號"><select id="body"><option value="">所有車型</option><option>轎車/掀背車</option><option>SUV/跨界休旅</option><option>雙門跑車/GT</option><option>敞篷/跑車</option><option>MPV/廂型車</option><option>皮卡/商用車</option></select></div></div><p id="count" class="muted"></p><div id="grid" class="grid"></div></main>
<dialog id="dlg"><button class="x" onclick="dlg.close()">×</button><div id="detail"></div></dialog>
<script>
let d=[],reg='全部',br='全部',currentIndex=-1;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){d=await fetch('catalog.json').then(r=>r.json());drawR();drawB();render()}
function drawR(){regions.innerHTML=['全部',...new Set(d.map(x=>x.region))].map(x=>`<button class="chip ${x===reg?'on':''}" onclick="reg='${esc(x)}';br='全部';drawR();drawB();render()">${esc(x)}</button>`).join('')}
function drawB(){let a=['全部',...new Set(d.filter(x=>reg==='全部'||x.region===reg).map(x=>x.brand))];brands.innerHTML=a.map(x=>`<button class="chip ${x===br?'on':''}" onclick="br='${esc(x)}';drawB();render()">${esc(x)}</button>`).join('')}
function ok(x){let s=q.value.trim().toLowerCase(),hay=(x.brand+' '+x.model+' '+x.body+' '+JSON.stringify(x.variants)).toLowerCase();return(reg==='全部'||x.region===reg)&&(br==='全部'||x.brand===br)&&(!body.value||x.body===body.value)&&(!s||hay.includes(s))}
function render(){let a=d.filter(ok);count.textContent=`找到 ${a.length} 個車系`;grid.innerHTML=a.map(x=>`<article class="card"><div class="muted">${esc(x.brand)}｜${esc(x.body)}</div><h3>${esc(x.model)}</h3><div class="muted">${x.variants?.length?`${x.variants.length} 個世代資料`:'可開啟車系與規格查詢'}</div><br><button class="btn primary" onclick="openM(${d.indexOf(x)})">查看世代與型號</button></article>`).join('')}
function fallbackVariants(x){return [{gen:'車系總覽',years:'歷代／現行型號',models:[x.model]}]}
function google(z){return 'https://www.google.com/search?q='+encodeURIComponent(z)}
function groupsFor(x){return x.variants&&x.variants.length?x.variants:[{gen:'車系總覽',years:'歷代／現行型號',models:[x.model]}]}
function openM(i){let x=d[i],groups=groupsFor(x),note=x.variants&&x.variants.length?'':'<div class="tip">此車系尚未建立離線世代資料，但仍可點擊型號進入介紹與精準規格搜尋。</div>';detail.innerHTML=`<h2>${x.brand} ${x.model}</h2><p class="muted">${x.region}｜${x.body}</p>${note}${groups.map((g,gi)=>`<section class="gen"><b>${g.gen}</b> <span class="muted">${g.years||''}</span><div class="models">${g.models.map((m,mi)=>`<button class="btn" onclick="openVariant(${i},${gi},${mi})">${m}</button>`).join('')}</div></section>`).join('')}<div class="actions"><a class="btn primary" target="_blank" href="${google(x.brand+' '+x.model+' generations chassis codes model history')}">搜尋完整歷代型號</a></div>`;dlg.showModal()}
function openVariant(i,gi,mi){let x=d[i],g=groupsFor(x)[gi],m=g.models[mi],name=`${x.brand} ${m} ${g.gen==='車系總覽'?'':g.gen}`.trim();detail.innerHTML=`<button class="btn back" onclick="openM(${i})">返回型號列表</button><h2>${name}</h2><p class="intro">${x.brand} ${m} 屬於 ${x.model} 車系，分類為「${x.body}」。${g.gen==='車系總覽'?'可利用下方按鈕查詢不同年份與市場版本。':`此型號屬於 ${g.gen} 世代，年份為 ${g.years}。`}</p><div class="specs"><div class="spec"><b>馬力／扭力／引擎</b><span class="muted">依年份與市場版本不同</span><br><br><a class="btn primary" target="_blank" href="${google(name+' horsepower PS kW torque Nm engine specifications')}">直接查馬力</a></div><div class="spec"><b>極速／0–100 km/h</b><span class="muted">依動力與驅動版本不同</span><br><br><a class="btn primary" target="_blank" href="${google(name+' top speed 0-100 km/h acceleration')}">直接查速度</a></div><div class="spec"><b>台灣售價／中古行情</b><span class="muted">搜尋新車與中古市場</span><br><br><a class="btn primary" target="_blank" href="${google(name+' 台灣 新車售價 中古車價格 2026')}">直接查售價</a></div></div><div class="actions"><a class="btn" target="_blank" href="${google(name+' full specifications engine displacement drivetrain')}">完整規格</a><a class="btn" target="_blank" href="${google(name+' exterior interior images')}">車輛圖片</a><a class="btn" target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+' review test drive')}">實車介紹</a></div>`}
q.oninput=render;body.onchange=render;if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');init();
</script></body></html>
