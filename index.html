<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<title>Auto Atlas V3</title>
<style>
:root{--r:#e50914;--bg:#08090b;--c:#16181d;--c2:#22252b;--line:#3a3d45;--muted:#aab1bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif}header{padding:28px 18px;background:linear-gradient(135deg,#8a0008,#111)}h1,h2,h3{margin-top:0}.wrap{max-width:1450px;margin:auto;padding:12px}.sticky{position:sticky;top:0;z-index:4;background:#08090bf2;padding:8px 0}.chips{display:flex;gap:8px;overflow:auto;padding:6px 0}.chip,.btn{border:1px solid #444;background:#24262c;color:#fff;border-radius:99px;padding:10px 14px;white-space:nowrap;cursor:pointer}.on,.primary{background:var(--r)!important;border-color:var(--r)!important}.search{display:grid;grid-template-columns:2fr 1fr;gap:8px}input,select{padding:13px;border-radius:11px;border:1px solid #444;background:#14161a;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}.card{background:var(--c);border:1px solid #30333a;border-radius:15px;padding:15px}.card h3{margin:5px 0}.muted{color:var(--muted);font-size:13px}.btn{border-radius:10px;text-decoration:none;display:inline-block}.btn:hover{filter:brightness(1.18)}dialog{width:min(900px,95vw);max-height:90vh;overflow:auto;background:#15171b;color:#fff;border:1px solid #555;border-radius:18px;padding:20px}.gen{background:var(--c2);padding:14px;border-radius:12px;margin:10px 0}.models,.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.x{float:right;border:0;border-radius:50%;width:38px;height:38px;cursor:pointer}.back{margin-bottom:12px}.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.spec{background:var(--c2);border:1px solid var(--line);border-radius:12px;padding:13px}.spec b{display:block;margin-bottom:5px}.intro{line-height:1.7;color:#d5d9e0}.tip{border-left:4px solid var(--r);background:#241719;padding:11px 13px;border-radius:8px;margin:12px 0}.result-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
@media(max-width:700px){.search{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.specs{grid-template-columns:1fr}dialog{padding:15px}}
</style>
</head>
<body>
<header><h1>Auto Atlas V3</h1><p>品牌 → 車系 → 世代 → 詳細型號 → 規格／售價／圖片搜尋</p></header>
<main class="wrap"><div class="sticky"><div id="regions" class="chips"></div><div id="brands" class="chips"></div><div class="search"><input id="q" placeholder="搜尋品牌、車系、世代、底盤或詳細型號"><select id="body"><option value="">所有車型</option><option>轎車/掀背車</option><option>SUV/跨界休旅</option><option>雙門跑車/GT</option><option>敞篷/跑車</option><option>MPV/廂型車</option><option>皮卡/商用車</option></select></div></div><p id="count" class="muted"></p><div id="grid" class="grid"></div></main>
<dialog id="dlg"><button class="x" onclick="dlg.close()">×</button><div id="detail"></div></dialog>
<script>
let d=[],reg='全部',br='全部',currentIndex=-1;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){d=await fetch('catalog.json').then(r=>r.json());drawR();drawB();render()}
function drawR(){regions.innerHTML=['全部',...new Set(d.map(x=>x.region))].map(x=>`<button class="chip ${x===reg?'on':''}" onclick="reg='${esc(x)}';br='全部';drawR();drawB();render()">${esc(x)}</button>`).join('')}
function drawB(){let a=['全部',...new Set(d.filter(x=>reg==='全部'||x.region===reg).map(x=>x.brand))];brands.innerHTML=a.map(x=>`<button class="chip ${x===br?'on':''}" onclick="br='${esc(x)}';drawB();render()">${esc(x)}</button>`).join('')}
function ok(x){let s=q.value.trim().toLowerCase(),hay=(x.brand+' '+x.model+' '+x.body+' '+JSON.stringify(x.variants)).toLowerCase();return(reg==='全部'||x.region===reg)&&(br==='全部'||x.brand===br)&&(!body.value||x.body===body.value)&&(!s||hay.includes(s))}
function render(){let a=d.filter(ok);count.textContent=`找到 ${a.length} 個車系`;grid.innerHTML=a.map(x=>`<article class="card"><div class="muted">${esc(x.brand)}｜${esc(x.body)}</div><h3>${esc(x.model)}</h3><div class="muted">${x.variants?.length?`${x.variants.length} 個世代資料`:'可開啟車系與規格查詢'}</div><br><button class="btn primary" onclick="openM(${d.indexOf(x)})">查看世代與型號</button></article>`).join('')}
function fallbackVariants(x){return [{gen:'車系總覽',years:'歷代／現行型號',models:[x.model]}]}
function openM(i){currentIndex=i;let x=d[i],groups=x.variants?.length?x.variants:fallbackVariants(x);let note=x.variants?.length?'':`<div class="tip">此車系的離線資料尚未拆分世代。仍可點擊下方型號，進入完整規格搜尋頁。搜尋會自動帶入馬力、極速、0–100 km/h 與售價等關鍵字。</div>`;detail.innerHTML=`<h2>${esc(x.brand)} ${esc(x.model)}</h2><p class="muted">${esc(x.region)}｜${esc(x.body)}</p>${note}${groups.map((g,gi)=>`<section class="gen"><b>${esc(g.gen)}</b> <span class="muted">${esc(g.years||'')}</span><div class="models">${g.models.map((m,mi)=>`<button class="btn" onclick="openVariant(${i},${gi},${mi})">${esc(m)}</button>`).join('')}</div></section>`).join('')}<div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="${google(`${x.brand} ${x.model} generations chassis codes model history`)}">搜尋完整歷代型號</a><a class="btn" target="_blank" rel="noopener" href="${google(`${x.brand} ${x.model} 台灣 售價 規格 馬力 極速`)}">搜尋台灣規格與售價</a></div>`;dlg.showModal()}
function modelData(i,gi,mi){let x=d[i],groups=x.variants?.length?x.variants:fallbackVariants(x),g=groups[gi],m=g.models[mi];return{x,g,m,name:`${x.brand} ${m}${m===x.model?'':` ${x.model}`} ${g.gen==='車系總覽'?'':g.gen}`.replace(/\s+/g,' ').trim()}}
function google(query){return 'https://www.google.com/search?q='+encodeURIComponent(query)}
function openVariant(i,gi,mi){let {x,g,m,name}=modelData(i,gi,mi);let intro=`${x.brand} ${m} 屬於 ${x.model} 車系，車身分類為「${x.body}」。${g.gen!=='車系總覽'?`此型號歸於 ${g.gen} 世代，資料年份為 ${g.years}。`:'可透過下方精準搜尋，查看不同年份、動力版本與市場規格。'}`;let searches={power:`${name} horsepower PS kW torque Nm engine specifications`,speed:`${name} top speed 0-100 km/h acceleration`,price:`${name} 台灣 新車售價 中古車價格 2026`,full:`${name} full specifications engine displacement drivetrain dimensions`,image:`${name} exterior interior images`,video:`${name} review test drive`};detail.innerHTML=`<button class="btn back" onclick="openM(${i})">← 返回 ${esc(x.model)} 型號列表</button><div class="result-title"><div><h2>${esc(name)}</h2><div class="muted">${esc(g.years||'')}｜${esc(x.body)}</div></div></div><p class="intro">${esc(intro)}</p><div class="specs"><div class="spec"><b>馬力／扭力／引擎</b><span class="muted">依年份與市場版本不同</span><br><br><a class="btn primary" target="_blank" rel="noopener" href="${google(searches.power)}">直接查馬力</a></div><div class="spec"><b>極速／0–100 km/h</b><span class="muted">依動力與驅動版本不同</span><br><br><a class="btn primary" target="_blank" rel="noopener" href="${google(searches.speed)}">直接查速度</a></div><div class="spec"><b>台灣售價／中古行情</b><span class="muted">同時搜尋新車與中古市場</span><br><br><a class="btn primary" target="_blank" rel="noopener" href="${google(searches.price)}">直接查售價</a></div></div><div class="actions"><a class="btn" target="_blank" rel="noopener" href="${google(searches.full)}">完整規格</a><a class="btn" target="_blank" rel="noopener" href="${google(searches.image)}">車輛圖片</a><a class="btn" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(searches.video)}">YouTube 實車介紹</a><a class="btn" target="_blank" rel="noopener" href="${google(`${name} site:car.info OR site:automobile-catalog.com OR site:encycarpedia.com specifications`)}">規格資料庫</a></div>`}
q.oninput=render;body.onchange=render;if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');init();
</script></body></html>
