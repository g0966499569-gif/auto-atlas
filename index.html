<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest"><title>Auto Atlas Lite</title><style>:root{--a:#e50914;--bg:#08090b;--card:#15171b;--line:#2b2e34;--muted:#9ca3af}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif}header{padding:28px 18px;background:linear-gradient(135deg,#8b0008,#111 70%)}h1{margin:0;font-size:clamp(30px,7vw,58px)}.wrap{max-width:1500px;margin:auto;padding:12px}.toolbar{position:sticky;top:0;z-index:5;background:#08090bf2;padding:10px 0;backdrop-filter:blur(12px)}.regions,.brands{display:flex;gap:8px;overflow:auto;padding:7px 0}.chip{white-space:nowrap;border:1px solid #3d4148;background:#181a1f;color:#fff;border-radius:99px;padding:10px 14px}.chip.on{background:var(--a);border-color:var(--a)}input{width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#13151a;color:#fff;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{background:linear-gradient(145deg,#191b20,#101115);border:1px solid var(--line);border-radius:16px;padding:16px;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#d23}.brandname{color:#ff4e55;font-weight:800;font-size:13px}.card h3{margin:5px 0 8px}.muted{color:var(--muted);font-size:13px}.btns{display:flex;gap:8px;margin-top:14px}.btn{flex:1;border:1px solid #444;background:#24272d;color:white;border-radius:10px;padding:10px;text-decoration:none;text-align:center}.btn.primary{background:var(--a);border-color:var(--a)}dialog{width:min(700px,94vw);background:#15171b;color:white;border:1px solid #555;border-radius:18px;padding:20px}dialog::backdrop{background:#000c}.close{float:right;border:0;border-radius:50%;width:36px;height:36px;font-size:20px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.install{background:#ffd500;color:#111;border:0;padding:11px 14px;border-radius:10px;font-weight:800}@media(max-width:580px){.grid{grid-template-columns:1fr}.quick{grid-template-columns:1fr}}</style></head><body><header><h1>Auto Atlas Lite</h1><p>快速車系索引：選地區、選品牌、搜尋車系，點開直接查網路資料。</p><button class="install" id="install" hidden>安裝到手機</button></header><main class="wrap"><div class="toolbar"><div id="regions" class="regions"></div><div id="brands" class="brands"></div><input id="q" placeholder="搜尋品牌或車系，例如 Corolla、911、GT-R、U6"></div><p id="count" class="muted"></p><section id="grid" class="grid"></section></main><dialog id="dlg"><button class="close" onclick="dlg.close()">×</button><div id="detail"></div></dialog><script>let data=[],region='全部',brand='全部',deferred;const $=s=>document.querySelector(s);async function init(){data=await fetch('catalog.json').then(r=>r.json());drawRegions();drawBrands();render()}function drawRegions(){regions.innerHTML=['全部',...new Set(data.map(x=>x.region))].map(x=>`<button class="chip ${x===region?'on':''}" onclick="region='${x}';brand='全部';drawRegions();drawBrands();render()">${x}</button>`).join('')}function drawBrands(){let a=['全部',...new Set(data.filter(x=>region==='全部'||x.region===region).map(x=>x.brand))];brands.innerHTML=a.map(x=>`<button class="chip ${x===brand?'on':''}" onclick="brand='${x}';drawBrands();render()">${x}</button>`).join('')}function result(x){let s=q.value.trim().toLowerCase();return(region==='全部'||x.region===region)&&(brand==='全部'||x.brand===brand)&&(!s||(x.brand+' '+x.brand_zh+' '+x.model).toLowerCase().includes(s))}function render(){let a=data.filter(result);count.textContent=`找到 ${a.length} 個主要車系，共 ${data.length} 筆`;grid.innerHTML=a.map((x,i)=>`<article class="card"><div class="brandname">${x.brand} · ${x.brand_zh}</div><h3>${x.model}</h3><div class="muted">${x.region}｜${x.years}</div><div class="btns"><button class="btn" onclick="openM(${data.indexOf(x)})">更多選項</button><a class="btn primary" target="_blank" href="https://www.google.com/search?q=${encodeURIComponent(x.keywords+' 車型 年份 改款')} ">搜尋資料</a></div></article>`).join('')}function openM(i){let x=data[i],k=encodeURIComponent(x.keywords);detail.innerHTML=`<h2>${x.brand} ${x.model}</h2><p class="muted">同一車系的不同世代、改款與動力版本集中於此入口。</p><div class="quick"><a class="btn primary" target="_blank" href="https://www.google.com/search?q=${k+' generations facelift'}">歷代／改款</a><a class="btn" target="_blank" href="https://www.google.com/search?tbm=isch&q=${k}">圖片辨識</a><a class="btn" target="_blank" href="https://www.google.com/search?q=${k+' 台灣 售價 規格'}">台灣售價／規格</a><a class="btn" target="_blank" href="https://www.google.com/search?q=${k+' official'}">官方資料</a><a class="btn" target="_blank" href="https://autos.yahoo.com.tw/new-cars/research/">Yahoo汽車品牌庫</a><a class="btn" target="_blank" href="https://www.kingautos.net/cardata">KingAutos資料庫</a></div>`;dlg.showModal()}q.addEventListener('input',render);addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.hidden=false});install.onclick=()=>deferred&&deferred.prompt();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');init()</script></body></html>
